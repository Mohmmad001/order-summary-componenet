<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Order summary card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="container">

    <div class="image">
        <img src="images/illustration-hero.svg" alt="">
      </div>

    <div class="title">
       Order Summary
    </div>

    <div class="descreption">
     <p>You can now listen to millions of songs, audiobooks, and podcasts on any 
  device anywhere you like!</p> 
    </div>

    <div class="plan-container">

      <div class="img-music">
        <img src="images/icon-music.svg" alt="">
      </div>
      
      <div class="plan-type">
        <div class="title">Annual Plan</div> 
        <div class="price">$59.99/year</div> 
      </div>

      <div class="change-button">
          Change
      </div>
    </div>

    <div class="pay-button">
       Proceed to Payment
    </div>

    <div class="cancel-button">
          Cancel Order
    </div>

  </div>
   
  
</body>
</html>
